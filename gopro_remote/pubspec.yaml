name: gopro_remote
description: Android remote for GoPro HERO10–13 Black via Open GoPro BLE.
publish_to: 'none'
version: 0.1.11+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.4.0
  http: ^1.4.0
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
