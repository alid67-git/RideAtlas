name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin below Flutter 3.50: that release requires Gradle ≥9.3.1 and
      # AGP ≥9.1.1. We stay on AGP 8.x (see android/settings.gradle.kts)
      # because file_picker and friends skip their Kotlin plugin under AGP
      # 9 and break the release APK. channel:stable alone jumped to 3.50
      # and left android-latest stuck on v1.4.129 while main already had
      # v1.4.130.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RideAtlas.apk

      # Embeds the build's own version label into the release name so the
      # app itself (see lib/services/update_checker.dart) can tell whether
      # this release is newer than the one currently running, without
      # needing a separate version-tagging scheme.
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "(?<=kAppBuildLabel = ')[^']+" lib/build_info.dart)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Overwrites a single rolling "android-latest" release on every push, so
      # there's always one stable download link with the newest build -
      # rather than accumulating a new release per push. Uses the debug
      # signing key (see android/app/build.gradle.kts), so this is a
      # sideload-only build, not something publishable to the Play Store.
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "RideAtlas Android (latest) - ${{ steps.version.outputs.version }}"
          body: |
            Otomatik olarak main dalındaki en son koddan derlendi.
            Kurmak için RideAtlas.apk dosyasını telefonunuza indirip açın
            (gerekirse "bilinmeyen kaynaklardan yükleme" iznini verin).
          files: build/app/outputs/flutter-apk/RideAtlas.apk
          make_latest: false
