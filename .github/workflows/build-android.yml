name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RideAtlas.apk

      # Overwrites a single rolling "android-latest" release on every push, so
      # there's always one stable download link with the newest build -
      # rather than accumulating a new release per push. Uses the debug
      # signing key (see android/app/build.gradle.kts), so this is a
      # sideload-only build, not something publishable to the Play Store.
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: RideAtlas Android (latest)
          body: |
            Otomatik olarak main dalındaki en son koddan derlendi.
            Kurmak için RideAtlas.apk dosyasını telefonunuza indirip açın
            (gerekirse "bilinmeyen kaynaklardan yükleme" iznini verin).
          files: build/app/outputs/flutter-apk/RideAtlas.apk
          make_latest: false
