<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GPX/KML/KMZ rotalarını haritada göster ve analiz et.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RideAtlas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RideAtlas</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Stamped from lib/build_info.dart by deploy-web.yml on every deploy -
    // keep in lockstep with web/sw.js APP_VERSION and the ?v= busters below.
    window.RIDEATLAS_WEB_VERSION = '1.4.80';
  </script>

  <style>
    /* Fixed bottom update banner (see app_update.js). Colors follow the
       app's own language: dark surface + the RideAtlas red accent used by
       the record button / track polyline. Hidden until .show is added. */
    #update-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 10000;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 8px 12px 16px;
      border-radius: 16px;
      background: rgba(20, 18, 24, 0.96);
      color: #ffffff;
      font: 500 15px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      max-width: 480px;
      margin: 0 auto;
    }
    #update-banner.show {
      display: flex;
      animation: update-banner-in 0.25s ease-out;
    }
    @keyframes update-banner-in {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #update-banner-text {
      flex: 1;
      min-width: 0;
    }
    #update-btn {
      flex: none;
      border: 0;
      border-radius: 20px;
      padding: 8px 18px;
      background: #e53935;
      color: #ffffff;
      font: 600 14px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      cursor: pointer;
    }
    #update-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #update-dismiss {
      flex: none;
      border: 0;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    @media (prefers-color-scheme: light) {
      #update-banner {
        background: rgba(255, 255, 255, 0.98);
        color: #1c1b1f;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
      }
      #update-dismiss { color: rgba(28, 27, 31, 0.6); }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=1.4.80" async></script>

  <!-- Update banner: hidden by default, shown by app_update.js when a new
       service worker is waiting. Text is localized at runtime. -->
  <div id="update-banner" role="status">
    <span id="update-banner-text">Yeni sürüm hazır</span>
    <button id="update-btn" type="button">Güncelle</button>
    <button id="update-dismiss" type="button" aria-label="Kapat">✕</button>
  </div>

  <script src="app_update.js?v=1.4.80" defer></script>
</body>
</html>
